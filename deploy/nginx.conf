worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"request":"$request","status":$status,"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,"request_id":"$request_id"}';

  access_log /var/log/nginx/access.log main_json;
  error_log /var/log/nginx/error.log warn;

  upstream control_plane_api {
    server api:8080;
    keepalive 32;
  }

  upstream management_web {
    server web:80;
    keepalive 16;
  }

  server {
    listen 8080;
    server_name _;

    client_max_body_size 10m;

    location = /gateway-health {
      access_log off;
      default_type application/json;
      return 200 '{"status":"ok"}';
    }

    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_buffering off;
      proxy_read_timeout 65s;
      proxy_pass http://control_plane_api;
    }

    location / {
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://management_web;
    }
  }
}
