name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pve_classroom_test
          POSTGRES_USER: pve_classroom_test
          POSTGRES_PASSWORD: pve-classroom-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pve_classroom_test -d pve_classroom_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PVE_TEST_DATABASE_URL: postgres://pve_classroom_test:pve-classroom-test-password@127.0.0.1:5432/pve_classroom_test?sslmode=disable
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Download modules
        run: go mod download

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build
        run: |
          go build -o /tmp/pve-classroom-api ./cmd/api
          go build -o /tmp/pve-classroom-worker ./cmd/worker
          go build -o /tmp/pve-classroom-healthcheck ./cmd/healthcheck

      - name: Cross-compile Linux targets
        run: |
          for arch in amd64 loong64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -o "/tmp/pve-classroom-api-$arch" ./cmd/api
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -o "/tmp/pve-classroom-worker-$arch" ./cmd/worker
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -o "/tmp/pve-classroom-healthcheck-$arch" ./cmd/healthcheck
          done

  frontend:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint OpenAPI
        run: npx --yes @redocly/cli@2.40.0 lint api/openapi.yaml
